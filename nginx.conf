server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy /webhook → Orion-Construtora backend ─────────────────────────
    # Permite usar https://construtoraorion.com/webhook no Kommo
    location /webhook {
        proxy_pass         https://orion-construtora-production.up.railway.app/webhook;
        proxy_http_version 1.1;
        proxy_set_header   Host              orion-construtora-production.up.railway.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── Arquivos estáticos do quiz ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Favicon e meta.json
    location ~* \.(ico|json|png|css|js)$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
